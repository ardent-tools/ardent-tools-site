# GitHub Actions workflow for typikon-consuming sites.
#
# This file is a TEMPLATE. typikon-init copies it to a consumer site as
# .github/workflows/deploy.yml during scaffolding, substituting the two
# placeholders below.
#
# Placeholders (typikon-init replaces during scaffolding):
#   ardent-tools   — Cloudflare Pages project slug (e.g. ardent-site)
#   0.22.1   — pinned Zola version (current: 0.22.1)
#
# After substitution the workflow performs the strict gate, then deploys
# to Cloudflare Pages on green pushes or recovery dispatches from main.
#
# Secrets the consumer must set in GitHub repo settings:
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# Optional (enables the post-deploy CDN cache purge; without them the purge step
# warns and skips, and a shared-header change will not reach unchanged immutable
# resources until the cache is purged - see issue #79):
#   - CLOUDFLARE_ZONE_ID            (the zone id for the canonical domain)
#   - CLOUDFLARE_CACHE_PURGE_TOKEN  (a token scoped to zone:cache_purge)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recovery path when webhook delivery is degraded. Manual runs still execute
  # the same strict gate, pinned deployment, and live production verifier.
  workflow_dispatch:

# WHY: a production cutover (preview verify -> promote -> canonical verify)
# must never be interrupted mid-flight by a newer push (AT-01) - PR/build
# checks keep the prior aggressive-cancel group, while every push or
# workflow_dispatch run targeting main shares one dedicated, non-cancelable
# group so a second production run queues behind the first instead of
# canceling it.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'ardent-tools-production' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  gate-and-deploy:
    runs-on: ubuntu-latest
    # WHY 30: comfortably exceeds a normal gate+preview+promote+verify run
    # (observed well under 20m), while bounding how long a wedged run can
    # hold the non-cancelable production concurrency group below GitHub's
    # 6-hour default (AT-01 remediation).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive  # Pulls typikon as themes/typikon/
          persist-credentials: false
          fetch-depth: 0  # Retention history is proved against the event's trusted base SHA.

      # ── Tooling install ────────────────────────────────────────
      - name: Install Zola
        env:
          # Pinned per typikon Stage 2a. Refresh when ZOLA_VERSION bumps via:
          #   curl -sL https://github.com/getzola/zola/releases/download/v<X>/zola-v<X>-x86_64-unknown-linux-gnu.tar.gz | sha256sum
          ZOLA_SHA256: 0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef
        run: |
          curl -L "https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz" \
            -o zola.tar.gz
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python deps for typikon-validate
        run: |
          python3 -m pip install --user --require-hashes -r bin/requirements.txt

      - name: Install Typst and PDF inspection tools
        env:
          TYPST_VERSION: 0.14.2
          TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        run: |
          curl -L "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o typst.tar.xz
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c
          mkdir -p typst-extract
          tar -xJf typst.tar.xz -C typst-extract --strip-components=1
          sudo mv typst-extract/typst /usr/local/bin/
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          typst --version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # WHY: wrangler (deploy step) requires Node >=22; 20 fails the deploy.
          node-version: '22'

      - name: Install pa11y-ci, lychee, playwright
        env:
          # lychee pinned to a specific version (releases/latest is non-reproducible).
          # Refresh when LYCHEE_VERSION bumps via:
          #   curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v<X>/lychee-x86_64-unknown-linux-gnu.tar.gz | sha256sum
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
          curl -L "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            -o lychee.tar.gz
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c
          mkdir -p lychee-extract
          tar -xzf lychee.tar.gz -C lychee-extract --strip-components=1
          sudo mv lychee-extract/lychee /usr/local/bin/
          rm -rf lychee.tar.gz lychee-extract

      # ── Strict gate ────────────────────────────────────────────
      - name: Select prior asset-retention authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          bootstrap=0
          case "$EVENT_NAME" in
            pull_request)
              if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Pull-request retention base is absent or malformed." >&2
                exit 1
              fi
              base_revision="$PR_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                parent_record=$(git rev-list --parents -n 1 HEAD)
                read -r _head base_revision _rest <<< "$parent_record"
                if [[ -n "${base_revision:-}" ]]; then
                  echo "A created main ref has prior commit history; retention bootstrap is forbidden." >&2
                  exit 1
                fi
                bootstrap=1
              elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                base_revision="$PUSH_BEFORE_SHA"
              else
                echo "Push retention base is absent or malformed." >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              parent_record=$(git rev-list --parents -n 1 HEAD)
              read -r _head base_revision _rest <<< "$parent_record"
              if [[ -z "${base_revision:-}" ]]; then
                bootstrap=1
              fi
              ;;
            *) echo "unsupported event for retention authority: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$bootstrap" == 1 ]]; then
            echo "HEAD is the repository root commit; retention bootstrap is authorized."
          elif [[ ! "$base_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted retention base is malformed: $base_revision" >&2
            exit 1
          elif ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
            echo "Trusted retention base commit is unavailable: $base_revision" >&2
            exit 1
          elif git cat-file -e "${base_revision}:asset-retention.json" 2>/dev/null; then
            prior_ledger="$RUNNER_TEMP/prior-asset-retention.json"
            git show "${base_revision}:asset-retention.json" > "$prior_ledger"
            echo "ARDENT_RETENTION_BASE_LEDGER=$prior_ledger" >> "$GITHUB_ENV"
          else
            echo "Base revision has no retention ledger; treating this as retention bootstrap."
          fi

      - name: Repository-owned isolated strict gate
        env:
          # Retain the exact production tree the helper validates; normal
          # local runs remain temporary and leave the worktree unchanged.
          ARDENT_RETAIN_VALIDATED_PUBLIC: '1'
          ARDENT_BUILD_REVISION: ${{ github.sha }}
        run: python3 bin/site.py gate

      - name: Compile the Pages error boundary
        run: |
          wrangler pages functions build functions \
            --outfile "$RUNNER_TEMP/ardent-pages-worker.js"

      # ── Deploy green main revisions ───────────────────────────
      # AT-01 remediation: production is proved live BEFORE it is cut over.
      # The same gated public/ tree deploys twice - first as a non-production
      # preview (verified in full), then re-uploaded byte-for-byte to the
      # production branch. A failed preview verify never reaches the promote
      # step (see the INVARIANT note on that step below), and a failed
      # canonical verify after promote auto-restores the last-known-good
      # deployment captured here before either upload runs.
      - name: Capture last-known-good production deployment
        id: capture_last_good
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # WHY the CF API directly, not `wrangler pages deployment list
          # --json`: wrangler's --json output is a PascalCase DISPLAY
          # mapping ({Id, Environment:"Production", Source:<7-char-sha>,
          # ...}), not the lowercase deployment shape
          # bin/pages_last_deployment.py assumes, and Source truncates the
          # commit to 7 hex chars while bin/verify_restore.py needs the
          # full 40-hex revision to match build-revision.txt. The CF API
          # itself returns lowercase snake_case fields (id, environment,
          # created_on, deployment_trigger.metadata.commit_hash - full
          # 40-hex) - verified against
          # https://developers.cloudflare.com/api/resources/pages/subresources/projects/subresources/deployments/methods/list/
          # (AT-01 remediation).
          #
          # Paginated: `env=production` filters server-side so no page
          # mixes in preview deployments, but the endpoint's sort order and
          # per_page ceiling are undocumented, so every page is fetched and
          # concatenated - bin/pages_last_deployment.py's own created_on
          # sort picks the true newest regardless of API ordering.
          page=1
          per_page=100
          max_pages=50
          combined="$RUNNER_TEMP/ardent-production-deployments.json"
          echo '[]' > "$combined"
          while :; do
            if [ "$page" -gt "$max_pages" ]; then
              echo "::error::CF Pages production deployment list exceeded ${max_pages} pages (${per_page} per page); capture_last_good aborted rather than looping unbounded." >&2
              exit 1
            fi
            page_file="$RUNNER_TEMP/ardent-production-deployments-page-${page}.json"
            curl -sS --fail --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments?env=production&page=${page}&per_page=${per_page}" \
              -o "$page_file"
            jq -e '.success == true and (.result | type == "array")' "$page_file" > /dev/null
            jq -s '.[0] + .[1].result' "$combined" "$page_file" > "$combined.next"
            mv "$combined.next" "$combined"
            page_count=$(jq '.result | length' "$page_file")
            if [ "$page_count" -lt "$per_page" ]; then
              break
            fi
            page=$((page + 1))
          done
          python3 bin/pages_last_deployment.py "$combined" \
            --project ardent-tools >> "$GITHUB_OUTPUT"

      - name: Deploy preview to Cloudflare Pages
        id: preview_deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/ardent-wrangler-preview-output.jsonl
        run: |
          python3 bin/validate-site.py public --expected-revision "$GITHUB_SHA"
          wrangler pages deploy --branch="ci-preview-$GITHUB_SHA" --commit-hash "$GITHUB_SHA"
          preview_url=$(python3 bin/pages_deployment_receipt.py \
            "$WRANGLER_OUTPUT_FILE_PATH" \
            --expected-revision "$GITHUB_SHA" \
            --project ardent-tools \
            --production-branch main \
            --environment preview \
            --field url)
          preview_deployment_id=$(python3 bin/pages_deployment_receipt.py \
            "$WRANGLER_OUTPUT_FILE_PATH" \
            --expected-revision "$GITHUB_SHA" \
            --project ardent-tools \
            --production-branch main \
            --environment preview \
            --field id)
          echo "ARDENT_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "ARDENT_PREVIEW_DEPLOYMENT_ID=$preview_deployment_id" >> "$GITHUB_ENV"

      - name: Verify preview deployment
        id: preview_verify
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # The Pages Function/header plane can converge route-by-route after
          # Wrangler returns; retain a six-minute sleep budget for the full proof.
          python3 bin/verify-production.py \
            --base-url "$ARDENT_PREVIEW_URL" \
            --canonical-origin https://ardent.tools \
            --require-cf-ray \
            --require-logical-alias-tombstones \
            --attempts 37 --delay 10 \
            --expected-revision "$GITHUB_SHA" \
            --artifact-root public

      # INVARIANT: this step carries no failure()/success()/always() call in
      # its `if:`, so GitHub Actions implicitly ANDs success() onto it - if
      # preview_verify (or any earlier step) failed, this step is SKIPPED
      # automatically and production is never touched. Do not add
      # `if: always()` or otherwise weaken this condition; that would defeat
      # the AT-01 fail-safe (preview must verify before promotion).
      - name: Promote verified preview to production
        id: promote
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 bin/validate-site.py public --expected-revision "$GITHUB_SHA"
          wrangler pages deploy --branch=main --commit-hash "$GITHUB_SHA"

      - name: Purge Cloudflare cache so shared-header changes reach immutable resources
        # WHY: content-addressed /a/<sha> resources are served `immutable`. When a
        # shared response header (CSP, Permissions-Policy, ...) changes but a
        # resource's bytes do not, its URL is unchanged and the edge keeps serving
        # the cached response with the OLD header - the canonical-origin verify then
        # fails on every unchanged resource. Purging forces a re-fetch so every
        # response carries the current header contract. See issue #79.
        # Fail-open on absent secrets: skips with a warning, never breaks a deploy.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID / CLOUDFLARE_CACHE_PURGE_TOKEN not set; skipping CDN purge. A shared-header change will not reach unchanged immutable resources until the cache is purged (issue #79)."
            exit 0
          fi
          curl -sS --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-purge.json" -w 'HTTP %{http_code}\n' \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-purge.json')); print('purge success:', r.get('success'), r.get('errors') or ''); sys.exit(0 if r.get('success') else 1)"
          echo "cache purged; pausing for edge propagation before the canonical verify"
          sleep 15

      - name: Verify canonical domain after production cutover
        id: canonical_verify
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 bin/verify-production.py \
            --base-url https://ardent.tools \
            --canonical-origin https://ardent.tools \
            --require-cf-ray \
            --attempts 13 --delay 10 \
            --expected-revision "$GITHUB_SHA" \
            --artifact-root public

      # ── Auto-restore on a failed cutover ──────────────────────
      # Both steps below fire only when `promote` itself reached 'success'
      # (i.e. production bytes actually changed this run) and a later step
      # (canonical_verify) failed. If promote never ran or itself failed,
      # production was never touched and there is nothing to restore -
      # steps.promote.outcome stays 'skipped'/'failure' and neither step
      # below runs (implicit success() gating already stopped the job).
      #
      # INVARIANT: a job CANCELLATION (not failure) after a successful
      # promote does not trigger restore - both steps below gate on
      # failure(), and GHA's failure() explicitly excludes cancelled(), so
      # a cancelled run after promote leaves production exactly where
      # promote left it, unrestored. This is bounded, not unguarded: the
      # non-cancelable production concurrency group (see the top-level
      # `concurrency:` block) means a newer push queues behind this run
      # instead of cancelling it, and the job-level `timeout-minutes`
      # bounds how long a run can sit cancellable/wedged before someone
      # notices; production still holds the preview-verified bytes from
      # this run's promote in that window, never a half-written deploy. Do
      # not fake a cancellation-triggered restore with `if: cancelled()`:
      # a cancelled runner gets only a short grace period before it is
      # force-killed, so a rollback network call started there is itself
      # liable to be cut mid-flight - strictly worse than leaving
      # already-verified production bytes in place.
      - name: Restore last-known-good production deployment
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.promote.outcome == 'success' && steps.capture_last_good.outputs.had_prior_deployment == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAST_GOOD_DEPLOYMENT_ID: ${{ steps.capture_last_good.outputs.last_good_deployment_id }}
          LAST_GOOD_REVISION: ${{ steps.capture_last_good.outputs.last_good_revision }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "::error::Canonical verification failed after promoting $GITHUB_SHA; restoring last-known-good deployment $LAST_GOOD_DEPLOYMENT_ID (revision $LAST_GOOD_REVISION)"
          curl -sS --fail --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-rollback.json" -w 'HTTP %{http_code}\n' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments/${LAST_GOOD_DEPLOYMENT_ID}/rollback" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json"
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-rollback.json')); print('rollback success:', r.get('success'), r.get('errors') or ''); sys.exit(0 if r.get('success') else 1)"
          python3 bin/verify_restore.py \
            --base-url https://ardent.tools \
            --expected-revision "$LAST_GOOD_REVISION" \
            --attempts 13 --delay 10
          echo "::error::Production auto-restored to last-known-good revision $LAST_GOOD_REVISION after $GITHUB_SHA failed canonical verification"
          exit 1

      - name: Fail loudly - no prior production deployment to restore
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.promote.outcome == 'success' && steps.capture_last_good.outputs.had_prior_deployment != 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "::error::Canonical verification failed after promoting $GITHUB_SHA and there is no prior production deployment to auto-restore (this looks like the first production deployment). Manual intervention required."
          exit 1

      # ── Preview cleanup ────────────────────────────────────────
      # WHY always() + best-effort: ci-preview-<sha> deployments are public
      # and accumulate with no CF-side pruning. This step runs on every
      # path that reached a real preview deployment (success, failed
      # preview_verify, failed promote, or a failed-and-restored cutover)
      # so the preview is never left behind regardless of outcome; it never
      # fails the job itself, because cleanup failing must not change an
      # already-decided deploy or restore result.
      - name: Delete preview deployment
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.preview_deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # WHY force=true: ci-preview-<sha> is deployed via `--branch`, so
          # it carries the branch alias `ARDENT_PREVIEW_URL` points at - the
          # CF API rejects deleting an aliased non-production deployment
          # without this flag (verified against
          # https://developers.cloudflare.com/api/resources/pages/subresources/projects/subresources/deployments/methods/delete/).
          curl -sS --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-preview-delete.json" -w 'HTTP %{http_code}\n' \
            -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments/${ARDENT_PREVIEW_DEPLOYMENT_ID}?force=true" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            || echo "::warning::preview deployment cleanup request failed for $ARDENT_PREVIEW_DEPLOYMENT_ID (best-effort; not failing the job)"
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-preview-delete.json')); print('preview cleanup success:', r.get('success'), r.get('errors') or '')" \
            || echo "::warning::preview deployment cleanup response for $ARDENT_PREVIEW_DEPLOYMENT_ID could not be parsed (best-effort; not failing the job)"
