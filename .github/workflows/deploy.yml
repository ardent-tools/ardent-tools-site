# typikon: local
# GitHub Actions deploy workflow for ardent-tools.
#
# Runs the strict gate, then deploys to the `ardent-tools` Cloudflare Pages
# project on green pushes to main and on recovery dispatches. Zola is pinned
# to 0.23.3; wrangler, pa11y-ci and playwright are pinned in package.json and
# installed from the lockfile.
#
# NOTE: originally generated from typikon's ci/github-workflow.yml.tmpl, and
# since extended well beyond it. Do NOT run typikon-refresh against this file
# — refresh overwrites its target unconditionally and would discard the
# additions here (see forkwright/typikon#94). Upstream-shaped changes still
# belong in the template as well as here.
#
# Secrets the consumer must set in GitHub repo settings:
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# Optional (enables the post-deploy CDN cache purge; without them the purge step
# warns and skips, and a shared-header change will not reach unchanged immutable
# resources until the cache is purged - see issue #79):
#   - CLOUDFLARE_ZONE_ID            (the zone id for the canonical domain)
#   - CLOUDFLARE_CACHE_PURGE_TOKEN  (a token scoped to zone:cache_purge)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recovery path when webhook delivery is degraded. Manual runs still execute
  # the same strict gate, pinned deployment, and live production verifier.
  workflow_dispatch:

# WHY: a production cutover (preview verify -> promote -> canonical verify)
# must never be interrupted mid-flight by a newer push (AT-01) - PR/build
# checks keep the prior aggressive-cancel group, while every push or
# workflow_dispatch run targeting main shares one dedicated, non-cancelable
# group so a second production run queues behind the first instead of
# canceling it.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'ardent-tools-production' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  gate-and-deploy:
    runs-on: ubuntu-latest
    # WHY 60: this is the outer safety bound for gate + deployment + recovery.
    # The two apt-capable install steps carry narrower bounds below, so a
    # stalled package mirror cannot consume this entire production slot.
    # The outer bound remains well below GitHub's 6-hour default (AT-01).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive  # Pulls typikon as themes/typikon/
          persist-credentials: false
          fetch-depth: 0  # Retention history is proved against the event's trusted base SHA.

      # ── Tooling install ────────────────────────────────────────
      - name: Install Zola
        env:
          # Pinned per typikon Stage 2a. Refresh when ZOLA_VERSION bumps via:
          #   curl -sL https://github.com/getzola/zola/releases/download/v<X>/zola-v<X>-x86_64-unknown-linux-gnu.tar.gz | sha256sum
          ZOLA_SHA256: f07c92607e5745268b576bd325ceef3a582aada253bb64db8d92a8a85303d958
        run: |
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --retry-max-time 120 --connect-timeout 15 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/getzola/zola/releases/download/v0.23.3/zola-v0.23.3-x86_64-unknown-linux-gnu.tar.gz" \
            -o zola.tar.gz
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Python deps for typikon-validate
        run: |
          python3 -m pip install --user --require-hashes -r bin/requirements.txt

      - name: Install Typst and PDF inspection tools
        timeout-minutes: 12
        env:
          TYPST_VERSION: 0.14.2
          TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        run: |
          # WHY: hosted-runner mirror selection has repeatedly stalled inside
          # apt-get update. This runner-local policy bounds both the direct apt
          # calls here and Playwright's later child apt process.
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99ardent-ci-network >/dev/null
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --retry-max-time 300 --connect-timeout 15 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o typst.tar.xz
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c
          mkdir -p typst-extract
          tar -xJf typst.tar.xz -C typst-extract --strip-components=1
          sudo mv typst-extract/typst /usr/local/bin/
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          typst --version

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # WHY: wrangler (deploy step) requires Node >=22; 20 fails the deploy.
          node-version: '22'
          # setup-node v5 can infer package-manager caching from package.json.
          # This workflow installs from the reviewed lockfile without an
          # Actions cache contract.
          package-manager-cache: false

      - name: Install pa11y-ci, lychee, playwright
        timeout-minutes: 30
        env:
          # lychee pinned to a specific version (releases/latest is non-reproducible).
          # Refresh when LYCHEE_VERSION bumps via:
          #   curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v<X>/lychee-x86_64-unknown-linux-gnu.tar.gz | sha256sum
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --retry-max-time 300 --connect-timeout 15 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            -o lychee.tar.gz
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c
          mkdir -p lychee-extract
          tar -xzf lychee.tar.gz -C lychee-extract --strip-components=1
          sudo mv lychee-extract/lychee /usr/local/bin/
          rm -rf lychee.tar.gz lychee-extract

      # ── Strict gate ────────────────────────────────────────────
      - name: Select prior asset-retention authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          bootstrap=0
          case "$EVENT_NAME" in
            pull_request)
              if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Pull-request retention base is absent or malformed." >&2
                exit 1
              fi
              base_revision="$PR_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                parent_record=$(git rev-list --parents -n 1 HEAD)
                read -r _head base_revision _rest <<< "$parent_record"
                if [[ -n "${base_revision:-}" ]]; then
                  echo "A created main ref has prior commit history; retention bootstrap is forbidden." >&2
                  exit 1
                fi
                bootstrap=1
              elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                base_revision="$PUSH_BEFORE_SHA"
              else
                echo "Push retention base is absent or malformed." >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              parent_record=$(git rev-list --parents -n 1 HEAD)
              read -r _head base_revision _rest <<< "$parent_record"
              if [[ -z "${base_revision:-}" ]]; then
                bootstrap=1
              fi
              ;;
            *) echo "unsupported event for retention authority: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$bootstrap" == 1 ]]; then
            echo "HEAD is the repository root commit; retention bootstrap is authorized."
          elif [[ ! "$base_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted retention base is malformed: $base_revision" >&2
            exit 1
          elif ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
            echo "Trusted retention base commit is unavailable: $base_revision" >&2
            exit 1
          else
            if git cat-file -e "${base_revision}:asset-retention.json" 2>/dev/null; then
              prior_ledger="$RUNNER_TEMP/prior-asset-retention.json"
              git show "${base_revision}:asset-retention.json" > "$prior_ledger"
              echo "ARDENT_RETENTION_BASE_LEDGER=$prior_ledger" >> "$GITHUB_ENV"
            else
              echo "Base revision has no retention ledger; treating this as retention bootstrap."
            fi
            # WHY the same base_revision: the tombstone retain_through transition
            # check (release_manifest.py) is a second trusted-base authority over
            # a different file, not a separate git-history resolution - reusing
            # the event's already-selected base keeps both checks bound to one
            # commit rather than two independently-derived ones (#102).
            if git cat-file -e "${base_revision}:release-resources.toml" 2>/dev/null; then
              prior_contract="$RUNNER_TEMP/prior-release-resources.toml"
              git show "${base_revision}:release-resources.toml" > "$prior_contract"
              echo "ARDENT_PRIOR_RELEASE_CONTRACT=$prior_contract" >> "$GITHUB_ENV"
            else
              echo "Base revision has no release contract; treating this as tombstone-transition bootstrap."
            fi
          fi

      - name: Repository-owned isolated strict gate
        env:
          # Retain the exact production tree the helper validates; normal
          # local runs remain temporary and leave the worktree unchanged.
          ARDENT_RETAIN_VALIDATED_PUBLIC: '1'
          ARDENT_BUILD_REVISION: ${{ github.sha }}
          # lychee reads this for github.com requests, but it only covers a
          # bare `owner/repo`-root URL: lychee 0.24.2's GitHub fallback queries
          # GET /repos/{owner}/{repo} alone, so any github.com link with a
          # subpath (blob/*, issues/*) runs unauthenticated against github.com's
          # web frontend regardless of this token, and 404s or throttles
          # independent of whether the target exists. Unauthenticated, GitHub
          # allows 60 requests an hour per IP; the site carries dozens of
          # bare-root github.com links, so an unauthenticated run cannot finish
          # even that subset and the overflow arrives as connection-level
          # errors rather than as 429s - which link_check_contract.py fails
          # closed on by design, since a connection failure is indistinguishable
          # from a dead host. The subpath links this token cannot protect are
          # excluded from lychee in .lycheeignore and witnessed instead by
          # bin/verify-excluded-links.py (local checkout + targeted API calls)
          # and bin/validate-fleet-counts.py's .kanon-ci.toml check.
          # validate-fleet-counts.py also reads this token, to witness the
          # fleet's declared repository visibility and control-plane adoption
          # against the GitHub API directly rather than against the site's own
          # copy.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/site.py gate

      - name: Compile the Pages error boundary
        run: |
          wrangler pages functions build functions \
            --outfile "$RUNNER_TEMP/ardent-pages-worker.js"

      # ── Agent-corpus boundary (forkwright/typikon#188) ─────────
      # POSITION IS LOAD-BEARING: after every stage that can still write into
      # public/, and before the first upload. This site removed its
      # hand-authored llms.txt in #169 because D-068 decision 4 permits a
      # public corpus only with a named consumer and a generated freshness
      # guarantee, neither of which exists. Removing a file is a state;
      # config.toml's extra.agent_corpus_exposure plus this step is what makes
      # it a contract, so the removal cannot silently regress.
      - name: Assert the agent corpus stayed out of the rendered output
        timeout-minutes: 1
        run: |
          python3 themes/typikon/ci/validate-artifact-boundary.py \
            --root "$GITHUB_WORKSPACE" \
            public public-local

      # ── Deploy green main revisions ───────────────────────────
      # AT-01 remediation: production is proved live BEFORE it is cut over.
      # The same gated public/ tree deploys twice - first as a non-production
      # preview (verified in full), then re-uploaded byte-for-byte to the
      # production branch. A failed preview verify never reaches the promote
      # step (see the INVARIANT note on that step below), and a failed
      # canonical verify after promote auto-restores the last-known-good
      # deployment captured here before either upload runs.
      - name: Capture last-known-good production deployment
        id: capture_last_good
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # WHY the CF API directly, not `wrangler pages deployment list
          # --json`: wrangler's --json output is a PascalCase DISPLAY
          # mapping ({Id, Environment:"Production", Source:<7-char-sha>,
          # ...}), not the lowercase deployment shape
          # bin/pages_last_deployment.py assumes, and Source truncates the
          # commit to 7 hex chars while bin/verify_restore.py needs the
          # full 40-hex revision to match build-revision.txt. The CF API
          # itself returns lowercase snake_case fields (id, environment,
          # created_on, deployment_trigger.metadata.commit_hash - full
          # 40-hex) - verified against
          # https://developers.cloudflare.com/api/resources/pages/subresources/projects/subresources/deployments/methods/list/
          # (AT-01 remediation).
          #
          # Query params kept minimal: only `page`. The documented `env` and
          # `per_page` params returned HTTP 400 from the live endpoint (first
          # AT-01 cutover), so neither is sent - pages_last_deployment.py
          # filters environment==production client-side, and CF's default page
          # size with break-on-empty pagination covers the rest. curl does NOT
          # use --fail (which suppresses the response body); the CF error body
          # is logged on any non-success response so a failure is diagnosable
          # rather than a bare exit 22.
          page=1
          max_pages=50
          combined="$RUNNER_TEMP/ardent-production-deployments.json"
          echo '[]' > "$combined"
          while :; do
            if [ "$page" -gt "$max_pages" ]; then
              echo "::error::CF Pages deployment list exceeded ${max_pages} pages; capture_last_good aborted rather than looping unbounded." >&2
              exit 1
            fi
            page_file="$RUNNER_TEMP/ardent-production-deployments-page-${page}.json"
            curl -sS --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments?page=${page}" \
              -o "$page_file"
            if ! jq -e '.success == true and (.result | type == "array")' "$page_file" > /dev/null 2>&1; then
              echo "::error::CF Pages deployment list request failed (page ${page}); response body follows:" >&2
              cat "$page_file" >&2 || true
              exit 1
            fi
            jq -s '.[0] + .[1].result' "$combined" "$page_file" > "$combined.next"
            mv "$combined.next" "$combined"
            page_count=$(jq '.result | length' "$page_file")
            # Break on an empty page (no per_page sent, so CF's default page
            # size applies and its sort order is undocumented): fetch every
            # page until empty, bounded by max_pages; pages_last_deployment.py's
            # created_on sort then picks the true newest across all pages.
            if [ "$page_count" -eq 0 ]; then
              break
            fi
            page=$((page + 1))
          done
          python3 bin/pages_last_deployment.py "$combined" \
            --project ardent-tools >> "$GITHUB_OUTPUT"

      - name: Deploy preview to Cloudflare Pages
        id: preview_deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/ardent-wrangler-preview-output.jsonl
        run: |
          python3 bin/validate-site.py public --expected-revision "$GITHUB_SHA"
          # AT-02: recorded before the mutation itself, so it survives even
          # if wrangler or the receipt parse below fails after Cloudflare
          # already accepted the upload - steps.reconcile reads this to
          # decide whether Cloudflare's own state needs checking at all.
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          wrangler pages deploy --branch="ci-preview-$GITHUB_SHA" --commit-hash "$GITHUB_SHA"
          preview_url=$(python3 bin/pages_deployment_receipt.py \
            "$WRANGLER_OUTPUT_FILE_PATH" \
            --expected-revision "$GITHUB_SHA" \
            --project ardent-tools \
            --production-branch main \
            --environment preview \
            --field url)
          echo "ARDENT_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Verify preview deployment
        id: preview_verify
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # The Pages Function/header plane can converge route-by-route after
          # Wrangler returns; retain a six-minute sleep budget for the full proof.
          python3 bin/verify-production.py \
            --base-url "$ARDENT_PREVIEW_URL" \
            --canonical-origin https://ardent.tools \
            --require-cf-ray \
            --require-logical-alias-tombstones \
            --attempts 37 --delay 10 \
            --expected-revision "$GITHUB_SHA" \
            --artifact-root public

      # INVARIANT: this step carries no failure()/success()/always() call in
      # its `if:`, so GitHub Actions implicitly ANDs success() onto it - if
      # preview_verify (or any earlier step) failed, this step is SKIPPED
      # automatically and production is never touched. Do not add
      # `if: always()` or otherwise weaken this condition; that would defeat
      # the AT-01 fail-safe (preview must verify before promotion).
      - name: Promote verified preview to production
        id: promote
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 bin/validate-site.py public --expected-revision "$GITHUB_SHA"
          # AT-02: recorded before the mutation itself - see the identical
          # note on the preview_deploy step above.
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          wrangler pages deploy --branch=main --commit-hash "$GITHUB_SHA"

      - name: Purge Cloudflare cache so shared-header changes reach immutable resources
        # WHY: content-addressed /a/<sha> resources are served `immutable`. When a
        # shared response header (CSP, Permissions-Policy, ...) changes but a
        # resource's bytes do not, its URL is unchanged and the edge keeps serving
        # the cached response with the OLD header - the canonical-origin verify then
        # fails on every unchanged resource. Purging forces a re-fetch so every
        # response carries the current header contract. See issue #79.
        # Fail-open on absent secrets: skips with a warning, never breaks a deploy.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID / CLOUDFLARE_CACHE_PURGE_TOKEN not set; skipping CDN purge. A shared-header change will not reach unchanged immutable resources until the cache is purged (issue #79)."
            exit 0
          fi
          curl -sS --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-purge.json" -w 'HTTP %{http_code}\n' \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-purge.json')); print('purge success:', r.get('success'), r.get('errors') or ''); sys.exit(0 if r.get('success') else 1)"
          echo "cache purged; pausing for edge propagation before the canonical verify"
          sleep 15

      - name: Verify canonical domain after production cutover
        id: canonical_verify
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 bin/verify-production.py \
            --base-url https://ardent.tools \
            --canonical-origin https://ardent.tools \
            --require-cf-ray \
            --attempts 13 --delay 10 \
            --expected-revision "$GITHUB_SHA" \
            --artifact-root public

      # ── Reconcile actual Cloudflare state (AT-02) ─────────────
      # A step's own outcome proves only that the LOCAL client succeeded or
      # failed - it never proves what Cloudflare did. A network hiccup or a
      # receipt-parse error after Cloudflare already accepted an upload
      # fails that step while production or a public preview has already
      # changed. This step never reads steps.preview_deploy.outcome or
      # steps.promote.outcome; it re-fetches the live deployment list under
      # always() and asks Cloudflare directly whether THIS run's exact
      # commit landed on each branch. Everything downstream (restore,
      # cleanup) keys off its output, never off a step outcome.
      - name: Reconcile Cloudflare deployment state
        id: reconcile
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (steps.preview_deploy.outputs.attempted == 'true' || steps.promote.outputs.attempted == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          page=1
          max_pages=50
          combined="$RUNNER_TEMP/ardent-reconcile-deployments.json"
          echo '[]' > "$combined"
          while :; do
            if [ "$page" -gt "$max_pages" ]; then
              echo "::error::CF Pages deployment list exceeded ${max_pages} pages; reconcile aborted rather than looping unbounded." >&2
              exit 1
            fi
            page_file="$RUNNER_TEMP/ardent-reconcile-deployments-page-${page}.json"
            curl -sS --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments?page=${page}" \
              -o "$page_file"
            if ! jq -e '.success == true and (.result | type == "array")' "$page_file" > /dev/null 2>&1; then
              echo "::error::CF Pages deployment list request failed during reconcile (page ${page}); response body follows:" >&2
              cat "$page_file" >&2 || true
              exit 1
            fi
            jq -s '.[0] + .[1].result' "$combined" "$page_file" > "$combined.next"
            mv "$combined.next" "$combined"
            page_count=$(jq '.result | length' "$page_file")
            if [ "$page_count" -eq 0 ]; then
              break
            fi
            page=$((page + 1))
          done
          python3 bin/pages_reconcile.py "$combined" \
            --project ardent-tools \
            --revision "$GITHUB_SHA" \
            --preview-branch "ci-preview-$GITHUB_SHA" \
            --production-branch main >> "$GITHUB_OUTPUT"

      # ── Auto-restore on a failed cutover ──────────────────────
      # Both steps below fire when Cloudflare confirms THIS commit reached
      # production (steps.reconcile.outputs.production_accepted) and the
      # job is otherwise failing - never when `promote`'s own step merely
      # reported 'success', which a client-side failure after acceptance
      # would have hidden (AT-02). If Cloudflare never recorded this
      # commit in production, there is nothing to restore.
      #
      # INVARIANT: a job CANCELLATION (not failure) after production was
      # reached does not trigger restore - both steps below gate on
      # failure(), and GHA's failure() explicitly excludes cancelled(), so
      # a cancelled run leaves production exactly where it landed,
      # unrestored. This is bounded, not unguarded: the non-cancelable
      # production concurrency group (see the top-level `concurrency:`
      # block) means a newer push queues behind this run instead of
      # cancelling it, and the job-level `timeout-minutes` bounds how long
      # a run can sit cancellable/wedged before someone notices; production
      # still holds the preview-verified bytes from this run in that
      # window, never a half-written deploy. Do not fake a
      # cancellation-triggered restore with `if: cancelled()`: a cancelled
      # runner gets only a short grace period before it is force-killed, so
      # a rollback network call started there is itself liable to be cut
      # mid-flight - strictly worse than leaving already-verified
      # production bytes in place.
      - name: Restore last-known-good production deployment
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.reconcile.outputs.production_accepted == 'true' && steps.capture_last_good.outputs.had_prior_deployment == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAST_GOOD_DEPLOYMENT_ID: ${{ steps.capture_last_good.outputs.last_good_deployment_id }}
          LAST_GOOD_REVISION: ${{ steps.capture_last_good.outputs.last_good_revision }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "::error::Canonical verification failed after Cloudflare accepted $GITHUB_SHA in production; restoring last-known-good deployment $LAST_GOOD_DEPLOYMENT_ID (revision $LAST_GOOD_REVISION)"
          curl -sS --fail --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-rollback.json" -w 'HTTP %{http_code}\n' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments/${LAST_GOOD_DEPLOYMENT_ID}/rollback" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json"
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-rollback.json')); print('rollback success:', r.get('success'), r.get('errors') or ''); sys.exit(0 if r.get('success') else 1)"
          python3 bin/verify_restore.py \
            --base-url https://ardent.tools \
            --expected-revision "$LAST_GOOD_REVISION" \
            --attempts 13 --delay 10
          echo "::error::Production auto-restored to last-known-good revision $LAST_GOOD_REVISION after $GITHUB_SHA failed canonical verification"
          exit 1

      - name: Fail loudly - no prior production deployment to restore
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.reconcile.outputs.production_accepted == 'true' && steps.capture_last_good.outputs.had_prior_deployment != 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "::error::Canonical verification failed after Cloudflare accepted $GITHUB_SHA in production and there is no prior production deployment to auto-restore (this looks like the first production deployment). Manual intervention required."
          exit 1

      # WHY this is distinct from the two steps above: those decide
      # whether to restore GIVEN a known Cloudflare state. This fires when
      # that state itself could not be established at all - the reconcile
      # step attempted a query and failed (network, malformed response,
      # ambiguous match) after a mutation was attempted. Silence here would
      # mean a run can fail with production or a preview in an unknown
      # state and nothing says so.
      - name: Cloudflare deployment state is unresolved after this run
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (steps.preview_deploy.outputs.attempted == 'true' || steps.promote.outputs.attempted == 'true') && steps.reconcile.outcome != 'success'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "::error::Cloudflare deployment state could not be reconciled after $GITHUB_SHA's deploy attempt failed - a preview and/or production mutation may have landed with no confirmation either way. Manual audit of the ardent-tools Cloudflare Pages project is required before the next deploy."
          exit 1

      # ── Preview cleanup ────────────────────────────────────────
      # WHY always() + best-effort: ci-preview-<sha> deployments are public
      # and accumulate with no CF-side pruning. This step runs whenever
      # Cloudflare's own reconciled state confirms a preview landed for
      # this exact commit (success, failed preview_verify, failed promote,
      # a failed-and-restored cutover, or a receipt-parse failure after a
      # real upload - AT-02) so the preview is never left behind regardless
      # of any step's own outcome; it never fails the job itself, because
      # cleanup failing must not change an already-decided deploy or
      # restore result.
      - name: Delete preview deployment
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.reconcile.outputs.preview_accepted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DEPLOYMENT_IDS: ${{ steps.reconcile.outputs.preview_deployment_ids }}
        run: |
          # WHY force=true: ci-preview-<sha> is deployed via `--branch`, so
          # it carries the branch alias `ARDENT_PREVIEW_URL` points at - the
          # CF API rejects deleting an aliased non-production deployment
          # without this flag (verified against
          # https://developers.cloudflare.com/api/resources/pages/subresources/projects/subresources/deployments/methods/delete/).
          #
          # The id list comes from steps.reconcile (Cloudflare's own
          # confirmed state), never from a parsed wrangler receipt.
          # Normally one id; more than one means an earlier run's cleanup
          # was itself interrupted, and every one of them is still a real
          # public preview that must go.
          IFS=',' read -ra ids <<< "$PREVIEW_DEPLOYMENT_IDS"
          for id in "${ids[@]}"; do
            [ -z "$id" ] && continue
            curl -sS --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cf-preview-delete-${id}.json" -w 'HTTP %{http_code}\n' \
              -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ardent-tools/deployments/${id}?force=true" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              || echo "::warning::preview deployment cleanup request failed for $id (best-effort; not failing the job)"
            python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/cf-preview-delete-${id}.json')); print('preview cleanup success:', r.get('success'), r.get('errors') or '')" \
              || echo "::warning::preview deployment cleanup response for $id could not be parsed (best-effort; not failing the job)"
          done
