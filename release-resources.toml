  "atom.xml",
  "build-revision.txt",
  "career-claims.json",
  "llms.txt",
  "release-html.json",
  "robots.txt",
  "runtime-boundary.json",
  "sbom.cdx.json",
  "sitemap.xml",
  "systems.json",
]

# A tombstone is a promise that a removed path stays absent through its
# retain_through date (bin/release_manifest.py enforces the transition); the
# schema requires the key even while no promise is live.
tombstones = []
