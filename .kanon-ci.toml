# archetype:
# forge-only: false
# spdx:

# This direct-GitHub repository is not forge-onboarded (#93), so no Kanon
# post-receive hook consumes this file as a pipeline today. The writing-floor
# slice of "kanon-lint" below is not dormant, though: bin/check-site.sh runs
# the pinned equivalent (`kanon lint --writing`, kanon 0.11.0) directly as a
# stage of the same strict gate .github/workflows/deploy.yml and a local
# `python3 bin/site.py gate` both invoke, which is what makes docs/VOICE.md's
# "enforced by kanon lint" claim true today independent of forge onboarding.
# The full multi-category "kanon-lint" stage below (Rust/shell/Python beyond
# writing) and the "site-gate" stage stay unconsumed as a pipeline until #93
# lands and a post-receive hook exists to run them.
#
# The full strict gate (derivation verification + typikon-validate + zola check + zola build +
# csp-enforce + lychee + pa11y + playwright + Cloudflare Pages deploy)
# lives in .github/workflows/deploy.yml — that's where the real CI runs
# in the authoritative GitHub repository, since Wrangler is the only tested Cloudflare
# Pages deploy path (matches the pinned typikon SHA's own scaffold
# output — ci/kanon-ci.toml.tmpl doesn't exist yet at this pin; a later
# typikon-refresh may replace this stage with a rendered multi-stage
# file once that template lands). An operator may run this stage locally;
# it scopes Kanon lint away from themes/typikon (a separate repository,
# gated independently) and tests/fixtures/kanon-writing (deliberately-banned
# regression fixtures) via git-ls-files exclusions piped into --paths-from.

[pipeline]
stages = ["kanon-lint", "site-gate"]

[stages."kanon-lint"]
cmd = "sh -c 'f=$(mktemp) && git ls-files -- . \":!themes/typikon\" \":!tests/fixtures/kanon-writing\" > \"$f\" && kanon lint --paths-from \"$f\" .; rc=$?; rm -f \"$f\"; exit $rc'"
timeout_secs = 120

[stages."site-gate"]
cmd = "python3 bin/site.py gate"
timeout_secs = 1200

[verifier]
enabled = false
