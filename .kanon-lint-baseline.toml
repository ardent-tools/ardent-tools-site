reason = "Every entry here was measured as a RULE DEFECT, not site prose needing change: the rule fires on text that does not exhibit what it exists to catch. Filed as kanon#3324 with root causes -- weasel-word matches the comparative conjunction 'X rather than Y' as if it were the hedge 'rather good' (15 of these); extract_prose_paragraphs has no awareness of TOML frontmatter, so a cargo-test transcript embedded as a no-JS accessibility fallback is graded as prose (7); bookend-summary lacks the code-fence and table skip pattern every sibling rule carries (2); ban-listed tokens have no domain-sense or meta-reference exemption, so 'correctness harness' reads as the AI trope and VOICE.md's own glossary trips the ban it defines (5); elegant-variation never checks that its synonyms share a referent (2). The 18 GENUINE findings from the same 51 are fixed -- verified by removing each suppression and re-running the linter, not by judging the prose. Burn-down: #132 closes when kanon#3324 lands and this file is deleted, not by rewriting more prose."

