    <text x="514" y="56" font-family="Spectral, Georgia, serif" font-style="italic" font-size="11.5" fill="#6B6661">coupled during solve</text>
    <path d="M543.2,110.8 Q560,81 576.8,110.8" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M595.2,110.8 Q612,81 628.8,110.8" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M647.2,110.8 Q664,81 680.8,110.8" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M540.5,108.7 Q586,63 631.5,108.7" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M592.5,108.7 Q638,63 683.5,108.7" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M537.4,107.4 Q612,45 686.6,107.4" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="541.7" y1="130.5" x2="591.6" y2="198.8" stroke="#6B6661" stroke-width="1.4" marker-end="url(#ah)"/>
    <line x1="589.1" y1="132.6" x2="605.1" y2="198.5" stroke="#6B6661" stroke-width="1.4" marker-end="url(#ah)"/>
    <line x1="634.9" y1="132.6" x2="618.9" y2="198.5" stroke="#6B6661" stroke-width="1.4" marker-end="url(#ah)"/>
    <line x1="682.3" y1="130.5" x2="632.4" y2="198.8" stroke="#6B6661" stroke-width="1.4" marker-end="url(#ah)"/>
    <circle cx="534" cy="120" r="13" fill="#F0EBE0" stroke="#1C1917" stroke-width="1.3"/>
    <circle cx="586" cy="120" r="13" fill="#F0EBE0" stroke="#1C1917" stroke-width="1.3"/>
    <circle cx="638" cy="120" r="13" fill="#F0EBE0" stroke="#1C1917" stroke-width="1.3"/>
    <circle cx="690" cy="120" r="13" fill="#F0EBE0" stroke="#1C1917" stroke-width="1.3"/>
    <rect x="562" y="200" width="100" height="28" rx="3" fill="#F0EBE0" stroke="#1C1917" stroke-width="1.3"/>
    <text x="612" y="218" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#1C1917">integrator</text>
  </g>
  <g>
    <line x1="223" y1="283" x2="253" y2="283" stroke="#6B6661" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="263" y="287" font-family="Spectral, Georgia, serif" font-size="11.5" fill="#44403C">hand-off</text>
    <path d="M356,287 Q371,276 386,287" fill="none" stroke="#9E4A1E" stroke-width="2.2" stroke-linecap="round"/>
    <text x="396" y="287" font-family="Spectral, Georgia, serif" font-size="11.5" fill="#44403C">influence during solve</text>
  </g>
</svg>
